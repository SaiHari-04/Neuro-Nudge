<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NeuroNudge - Keystroke & Face Stats</title>
  <style>

    body {
      margin: 0; padding: 0;
      background: #ffffff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .panel-root {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #ffffff;
      padding: 12px 18px 24px;
      box-sizing: border-box;
    }

  
    .nn-header {
      color: #3b82f6;
      padding: 16px 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border-bottom: 1.8px solid #e0e7ff;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
    }

    .nn-icon-span {
      display: none; 
    }

   
    .nn-stats-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(160px, 1fr));
      gap: 12px 18px;
      margin-top: 22px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 380px; 
    }

   
    .nn-stat-card {
      background: transparent;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1.6px solid #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: none;
      transition: border-color 0.3s ease;
      font-size: 0.87rem;
    }

    .nn-stat-card:hover {
      border-color: #3b82f6;
    }

    .nn-stat-label {
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .nn-stat-value {
      font-size: 1.22rem;
      font-weight: 700;
      color: #1e293b; 
    }


    .info-section {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      padding: 22px 20px 26px 20px;
      max-width: 640px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .info-section h3 {
      margin: 0 0 14px 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #1e3a8a;
      user-select: none;
      text-align: center;
    }

    .video-container {
      position: relative;
      width: 320px;
      height: 213px;
      margin: 0 auto 14px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #2563eb;
      background: #e0e7ff;
    }

    .video-container video, .video-container canvas {
      position: absolute;
      top: 0; left: 0;
      width: 320px;
      height: 213px;
      border-radius: 12px;
    }

    .video-container video {
      z-index: 1;
      object-fit: cover;
    }

    .video-container canvas {
      z-index: 2;
      pointer-events: none;
    }

    #status {
      text-align: center;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #2563eb;
      user-select: none;
      min-height: 22px;
    }

    #emotions {
      max-width: 400px;
      margin: 14px auto 0 auto;
      font-size: 0.95rem;
    }

    #emotions h4 {
      margin-bottom: 10px;
      font-weight: 700;
      color: #374151;
      user-select: none;
      text-align: center;
    }

    #emotion-bars {
      font-size: 0.9rem;
      user-select: none;
    }

    #emotion-bars > div {
      margin: 6px 0 4px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #emotion-bars span {
      display: inline-block;
      min-width: 72px;
      font-weight: 600;
      color: #475569;
    }

    #emotion-bars div > div {
      height: 10px;
      border-radius: 5px;
      background: #a5b4fc;
      width: 0;
      transition: width 0.25s ease-in-out;
    }


    #bar-neutral { background: #2563eb; }
    #bar-happy { background: #22c55e; }
    #bar-sad { background: #3b82f6; }
    #bar-angry { background: #ef4444; }
    #bar-fearful { background: #6b7280; }
    #bar-disgusted { background: #d97706; }
    #bar-surprised { background: #f59e0b; }
   #tense-value {
      font-weight: 700;
      color: #dc2626;
      margin-left: 6px;
      user-select: none;
    }


    @media (max-width: 720px) {
      .nn-stats-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .video-container {
        width: 280px;
        height: 187px;
      }
      .video-container video, .video-container canvas {
        width: 280px;
        height: 187px;
      }
      .nn-stats-list {
        max-width: 100%;
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="panel-root">
  
    <div class="nn-header">
      NeuroNudge Monitor
    </div>


    <div class="nn-stats-list">
      <div class="nn-stat-card">
        <div class="nn-stat-label">Total Keystrokes</div>
        <div class="nn-stat-value" id="total-keys">0</div>
      </div>
      <div class="nn-stat-card">
        <div class="nn-stat-label">Avg Dwell Time</div>
        <div class="nn-stat-value" id="avg-dwell">0 ms</div>
      </div>
      <div class="nn-stat-card">
        <div class="nn-stat-label">Avg Flight Time</div>
        <div class="nn-stat-value" id="avg-flight">0 ms</div>
      </div>
      <div class="nn-stat-card">
        <div class="nn-stat-label">Typing Speed</div>
        <div class="nn-stat-value" id="typing-speed">0 WPM</div>
      </div>
      <div class="nn-stat-card">
        <div class="nn-stat-label">Error Rate</div>
        <div class="nn-stat-value" id="error-rate">0</div>
      </div>
      <div class="nn-stat-card">
        <div class="nn-stat-label">Session Time</div>
        <div class="nn-stat-value" id="session-time">00:00</div>
      </div>
    </div>

 
    <div class="info-section">
      <h3>Facial Stress Level</h3>
      <div class="video-container" id="videoContainer">
        <video id="video" width="320" height="213" autoplay muted></video>
        <canvas id="overlay" width="320" height="213"></canvas>
      </div>
      <div id="status">Loading models...</div>
      <div id="emotions">
        <h4>Expressions</h4>
        <div id="emotion-bars">
          <div>
            <span>Neutral</span>
            <div id="bar-neutral" style="width:0"></div>
            <span id="pct-neutral">0%</span>
          </div>
          <div>
            <span>Happy</span>
            <div id="bar-happy" style="width:0"></div>
            <span id="pct-happy">0%</span>
          </div>
          <div>
            <span>Sad</span>
            <div id="bar-sad" style="width:0"></div>
            <span id="pct-sad">0%</span>
          </div>
          <div>
            <span>Angry</span>
            <div id="bar-angry" style="width:0"></div>
            <span id="pct-angry">0%</span>
          </div>
          <div>
            <span>Fearful</span>
            <div id="bar-fearful" style="width:0"></div>
            <span id="pct-fearful">0%</span>
          </div>
          <div>
            <span>Disgusted</span>
            <div id="bar-disgusted" style="width:0"></div>
            <span id="pct-disgusted">0%</span>
          </div>
          <div>
            <span>Surprised</span>
            <div id="bar-surprised" style="width:0"></div>
            <span id="pct-surprised">0%</span>
          </div>
          <div style="margin-top: 10px; font-weight: 600; color: #b91c1c; text-align: center;">
            Tense Face (Anger) Level: <span id="tense-value">0%</span>
          </div>
        </div>
      </div>
    </div>

  </div>


  <script src="face-api.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
